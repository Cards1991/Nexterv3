<!-- Modal MBTI -->
<div class="modal fade" id="mbtiModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="fas fa-brain me-2"></i>Questionário MBTI</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                
                <!-- Container do Teste -->
                <div id="mbti-test-container">
                    <div class="progress mb-4" style="height: 20px;">
                        <div id="mbti-progress" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 25%;"></div>
                    </div>
                    <div class="text-center mb-4">
                        <h4 id="mbti-step-title" class="text-primary fw-bold">Etapa 1</h4>
                        <p id="mbti-step-desc" class="text-muted"></p>
                        <span id="mbti-progress-text" class="badge bg-secondary">Etapa 1 de 4</span>
                    </div>

                    <div class="alert alert-info py-2 small">
                        <i class="fas fa-info-circle me-1"></i> Escolha a afirmação que mais condiz com você ou com seu jeito de agir e pensar na maioria das vezes.
                    </div>

                    <div id="mbti-questions-container">
                        <!-- Questões renderizadas dinamicamente via JS -->
                    </div>

                    <div class="d-flex justify-content-between mt-4 border-top pt-3">
                        <button type="button" class="btn btn-outline-secondary" id="mbti-btn-prev" onclick="prevMbtiStep()" style="display: none;">
                            <i class="fas fa-arrow-left me-1"></i> Voltar
                        </button>
                        <button type="button" class="btn btn-primary px-4 ms-auto" id="mbti-btn-next" onclick="nextMbtiStep()">
                            Próxima Etapa <i class="fas fa-arrow-right ms-1"></i>
                        </button>
                    </div>
                </div>

                <!-- Container do Resultado -->
                <div id="mbti-result-container" style="display: none;" class="text-center">
                    <div class="mb-4">
                        <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
                    </div>
                    <h3 class="mb-1 text-primary">Seu Perfil: <span id="mbti-res-type" class="fw-bold fs-1 ms-2"></span></h3>
                    <h5 class="text-muted mb-4"><span id="mbti-res-title"></span> - <span id="mbti-res-group"></span></h5>
                    
                    <div class="card border-primary mb-4 text-start">
                        <div class="card-body bg-light">
                            <p id="mbti-res-desc" class="mb-0" style="line-height: 1.6;"></p>
                        </div>
                    </div>
                    
                    <button type="button" class="btn btn-success px-5 py-2" id="mbti-btn-fechar" data-bs-dismiss="modal">
                        <i class="fas fa-check me-2"></i> Concluir e Fechar
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
