<!-- Modal Novo Candidato -->
<div class="modal fade" id="modalCandidato" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white border-0">
                <h5 class="modal-title fw-bold"><i class="fas fa-user-plus me-2"></i> Ficha do Candidato</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body bg-light">
                <form id="formCandidato" class="card border-0 shadow-sm p-4">
                    <input type="hidden" id="candidatoId">
                    <input type="hidden" id="candidatoFaseAtual" value="triagem"> <!-- Fase inicial -->
                    
                    <div class="row g-4">
                        <div class="col-md-12">
                            <label class="form-label fw-semibold required">Vaga Pretendida</label>
                            <select id="candidatoVagaId" class="form-select form-select-lg bg-light" required>
                                <option value="">Selecione a vaga...</option>
                                <!-- Preenchido dinamicamente -->
                            </select>
                        </div>
                        <div class="col-12 col-md-7 col-lg-7">
                            <label class="form-label fw-semibold required">Nome Completo</label>
                            <input type="text" id="candidatoNome" class="form-control form-control-lg" required>
                        </div>
                        <div class="col-12 col-md-5 col-lg-5">
                            <label class="form-label fw-semibold required">CPF</label>
                            <div class="input-group shadow-sm">
                                <input type="text" id="candidatoCpf" class="form-control form-control-lg" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" oninput="formatarCPF(this)" required>
                                <button type="button" id="btn-escavador-candidato" class="btn btn-primary px-3 fw-bold" onclick="consultarCandidatoAPI()" title="Buscar Antecedentes" style="z-index: 0;">
                                    <i class="fas fa-search me-1"></i> Buscar
                                </button>
                            </div>
                        </div>
                        
                        <!-- Painel de Resumo do Totem (Preenchido dinamicamente se houver dados do Escavador) -->
                        <div class="col-12 mb-3" id="painel-resumo-totem" style="display: none;">
                            <div class="card border-0 bg-primary bg-opacity-10 shadow-sm">
                                <div class="card-body">
                                    <h5 class="text-primary mb-3"><i class="fas fa-clipboard-check me-2"></i>Resumo da Automação (Totem)</h5>
                                    <div class="row g-3">
                                        <div class="col-md-6 border-end border-primary border-opacity-25">
                                            <h6 class="text-dark fw-bold mb-2">Background Check (Escavador)</h6>
                                            <div id="totem-resumo-escavador">Carregando...</div>
                                        </div>
                                        <div class="col-md-6">
                                            <h6 class="text-dark fw-bold mb-2">Perfil Comportamental (MBTI)</h6>
                                            <div id="totem-resumo-mbti">Carregando...</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold required">Telefone/WhatsApp</label>
                            <input type="text" id="candidatoTelefone" class="form-control form-control-lg" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">E-mail</label>
                            <input type="email" id="candidatoEmail" class="form-control form-control-lg">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Anexar Currículo (PDF/DOC)</label>
                            <input type="file" id="candidatoCurriculo" class="form-control form-control-lg bg-white" accept=".pdf,.doc,.docx">
                            <small class="text-muted" id="linkCurriculoAtual"></small>
                        </div>
                        
                        <div class="col-12 mt-4" id="areaHistoricoColaborador" style="display: none;">
                            <div id="resultadoHistorico" style="max-height: 60vh; overflow-y: auto; overflow-x: hidden;">
                                <!-- Conteúdo gerado dinamicamente -->
                            </div>
                        </div>

                        <div class="col-12 mt-3" id="areaProcessosInternos" style="display: none;">
                            <div id="resultadoProcessosInternos" style="max-height: 50vh; overflow-y: auto; overflow-x: hidden;">
                                <!-- Conteúdo gerado dinamicamente -->
                            </div>
                        </div>

                        <div class="col-12 mt-3" id="areaEscavador" style="display: none;">
                            <div id="resultadoEscavador" style="max-height: 55vh; overflow-y: auto; overflow-x: hidden;">
                                <!-- Conteúdo gerado dinamicamente -->
                            </div>
                        </div>
                        
                        <div class="col-12 mt-4">
                            <h6 class="text-primary"><i class="fas fa-brain me-1"></i> Perfil Comportamental (MBTI) e Match</h6>
                            <div class="row g-3">
                                <!-- Candidato -->
                                <div class="col-md-6">
                                    <div class="border rounded p-3 bg-light h-100 d-flex flex-column justify-content-between">
                                        <div>
                                            <h6 class="text-muted mb-2 fs-6">Candidato</h6>
                                            <div id="candidato-mbti-resultado">
                                                <span class="text-muted fst-italic small">Teste MBTI ainda não realizado.</span>
                                            </div>
                                        </div>
                                        <button type="button" class="btn btn-outline-primary btn-sm mt-3 align-self-start" onclick="iniciarMBTICandidato()">
                                            <i class="fas fa-play me-1"></i> Aplicar Teste
                                        </button>
                                    </div>
                                </div>
                                <!-- Gerente/Match -->
                                <div class="col-md-6">
                                    <div class="border rounded p-3 bg-light h-100 d-flex flex-column justify-content-between" id="mbti-match-container">
                                        <div>
                                            <h6 class="text-muted mb-2 fs-6">Compatibilidade e Gestão</h6>
                                            <div id="gerente-mbti-resultado">
                                                <span class="text-muted fst-italic small">Aplique o teste MBTI no candidato primeiro.</span>
                                            </div>
                                        </div>
                                        <button type="button" class="btn btn-outline-primary btn-sm mt-3 align-self-start" id="btnAnalisarCompatibilidade" style="display: none;" onclick="abrirRankingMBTI()">
                                            <i class="fas fa-project-diagram me-1"></i> Analisar Gestores Disponíveis
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-12 mt-3">
                            <label class="form-label fw-semibold">Anotações / Entrevista</label>
                            <textarea id="candidatoAnotacoes" class="form-control bg-white" rows="4" placeholder="Adicione observações sobre a entrevista..."></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer d-flex justify-content-between">
                <button type="button" class="btn btn-outline-dark" onclick="imprimirFichaCandidato()"><i class="fas fa-print"></i> Imprimir Ficha</button>
                <div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="salvarCandidato()">Salvar Candidato</button>
                </div>
            </div>
        </div>
    </div>
</div>
