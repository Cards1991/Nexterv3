<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="page-title mb-0">Saúde Ocupacional - Estoque de EPI</h2>
    <div class="d-flex gap-2">
        <button class="btn btn-primary shadow-sm" id="btn-novo-epi" onclick="abrirModalEPI()">
            <i class="fas fa-plus-circle me-1"></i> Novo EPI
        </button>
        <button class="btn btn-success shadow-sm" onclick="abrirModalEntradaEstoque()">
            <i class="fas fa-arrow-circle-down me-1"></i> Entrada
        </button>
        <button class="btn btn-warning shadow-sm" onclick="gerarSolicitacaoCompraEPI()">
            <i class="fas fa-shopping-cart me-1"></i> Solicitação
        </button>
    </div>
</div>

<!-- Dashboard de Métricas e Alertas EPI -->
<div class="row g-3 mb-4">
    <!-- Total Itens -->
    <div class="col-md-4">
        <div class="card border-0 shadow-sm h-100 bg-light">
            <div class="card-body d-flex flex-column justify-content-center text-center">
                <h6 class="text-muted text-uppercase fw-bold mb-2">Total de Itens Diferentes</h6>
                <h3 class="mb-0 text-primary" id="epi-total-itens"><i class="fas fa-spinner fa-spin"></i></h3>
            </div>
        </div>
    </div>
    <!-- Alertas de Estoque Baixo -->
    <div class="col-md-8">
        <div class="card border-0 shadow-sm h-100" style="background-color: #fff3cd;">
            <div class="card-header bg-transparent border-warning text-dark fw-bold pb-0 pt-3">
                <i class="fas fa-exclamation-triangle me-2 text-warning"></i> Atenção: Estoque Baixo / Vencidos
            </div>
            <ul id="lista-alertas-epi" class="list-group list-group-flush" style="max-height: 120px; overflow-y: auto;">
                <li class="list-group-item bg-transparent text-muted small border-0">Nenhum alerta.</li>
            </ul>
        </div>
    </div>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 text-dark"><i class="fas fa-boxes me-2"></i> Inventário</h5>
        <div class="d-flex gap-3 align-items-center">
            <div class="form-check form-switch m-0">
                <input class="form-check-input" type="checkbox" id="filtro-epi-sem-custo" onchange="carregarEstoqueEPI()">
                <label class="form-check-label small" for="filtro-epi-sem-custo">Apenas Sem Custo</label>
            </div>
            <div class="input-group input-group-sm" style="max-width: 250px;">
                <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                <input type="text" class="form-control border-start-0" id="busca-epi" placeholder="Buscar EPI ou CA..." onkeyup="if(event.key === 'Enter') carregarEstoqueEPI()">
                <button class="btn btn-outline-secondary" onclick="carregarEstoqueEPI()">Buscar</button>
            </div>
        </div>
    </div>
    <div class="card-body p-0 table-responsive" style="max-height: 600px; overflow-y: auto;">
        <table class="table table-hover table-striped align-middle mb-0">
            <thead class="table-light sticky-top">
                <tr>
                    <th class="ps-3">Descrição do EPI</th>
                    <th>C.A.</th>
                    <th>Validade C.A.</th>
                    <th>Fornecedor</th>
                    <th class="text-center">Estoque Atual</th>
                    <th>Status</th>
                    <th class="text-end pe-3">Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-estoque-epi">
                <tr>
                    <td colspan="7" class="text-center py-4 text-muted"><i class="fas fa-spinner fa-spin me-2"></i> Carregando inventário...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
