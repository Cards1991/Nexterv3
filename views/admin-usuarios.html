<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Administração de Usuários</h2>
        <button class="btn btn-primary" onclick="abrirModalNovoUsuario()">
            <i class="fas fa-user-plus"></i> Novo Usuário
        </button>

        <button class="btn btn-outline-secondary" onclick="exibirSenhaCadastrada()" title="Mostrar a senha cadastrada">
            <i class="fas fa-eye"></i> Ver senha cadastrada
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th>Email</th>
                            <th>Nome</th>
                            <th>Admin</th>
                            <th>Restrição de Setor</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-usuarios-admin">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>



<script src="js/admin.js"></script>
