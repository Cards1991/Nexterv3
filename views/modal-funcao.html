<!-- Modal de Função -->
<div class="modal fade" id="funcaoModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="funcaoModalTitle">Nova Função</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="form-funcao">
                    <input type="hidden" id="funcao-id">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nome da Função (Cargo) <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="funcao-nome" placeholder="Ex: Operador de Máquina, Gerente..." required>
                    </div>

                    <hr class="text-muted">
                    <h6 class="fw-bold text-primary mb-3"><i class="fas fa-chart-line me-2"></i> Evolução Salarial (Opcional)</h6>
                    
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label small text-muted">Salário Inicial</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text">R$</span>
                                <input type="number" step="0.01" min="0" class="form-control" id="funcao-sal-inicial" placeholder="0.00">
                            </div>
                        </div>
                        <div class="col-6">
                            <label class="form-label small text-muted">Bônus Inicial</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text">R$</span>
                                <input type="number" step="0.01" min="0" class="form-control" id="funcao-bonus-inicial" placeholder="0.00">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label small text-muted">Após 3 Meses</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text">R$</span>
                                <input type="number" step="0.01" min="0" class="form-control" id="funcao-sal-3m" placeholder="0.00">
                            </div>
                        </div>
                        <div class="col-6">
                            <label class="form-label small text-muted">Após 6 Meses</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text">R$</span>
                                <input type="number" step="0.01" min="0" class="form-control" id="funcao-sal-6m" placeholder="0.00">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row g-2">
                        <div class="col-4">
                            <label class="form-label small text-muted">Após 8 Meses</label>
                            <input type="number" step="0.01" min="0" class="form-control form-control-sm" id="funcao-sal-8m" placeholder="0.00">
                        </div>
                        <div class="col-4">
                            <label class="form-label small text-muted">1 Ano / 2 Meses</label>
                            <input type="number" step="0.01" min="0" class="form-control form-control-sm" id="funcao-sal-14m" placeholder="0.00">
                        </div>
                        <div class="col-4">
                            <label class="form-label small text-muted">Bônus 1 Ano</label>
                            <input type="number" step="0.01" min="0" class="form-control form-control-sm" id="funcao-bonus-1a" placeholder="0.00">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary px-4" onclick="salvarFuncao()" id="btn-salvar-funcao">Salvar Função</button>
            </div>
        </div>
    </div>
</div>
