<h2 class="page-title">Cadastro de Funções</h2>

<div class="card premium-card border-0 mb-4 shadow-sm">
    <div class="card-body">
        <div class="row align-items-center">
            <div class="col-md-6">
                <p class="text-muted mb-0">Gerencie todos os cargos (funções) disponíveis para cada empresa do sistema.</p>
            </div>
            <div class="col-md-6 text-md-end mt-3 mt-md-0 d-flex gap-2 justify-content-md-end flex-wrap">
                <button class="btn btn-warning" onclick="migrarFuncoesAntigas()" id="btn-migrar-funcoes" title="Migrar funções salvas no formato antigo">
                    <i class="fas fa-magic"></i> Migrar Funções Antigas
                </button>
                <button class="btn btn-primary" onclick="abrirModalFuncao()">
                    <i class="fas fa-plus"></i> Nova Função
                </button>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header bg-white py-3">
        <div class="row align-items-center">
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-building"></i></span>
                    <select class="form-select border-start-0 ps-0 bg-light" id="filtro-empresa-funcoes" onchange="carregarFuncoes()">
                        <option value="">Todas as Empresas...</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light sticky-top">
                    <tr>
                        <th class="ps-4">Nome da Função</th>
                        <th>Empresa</th>
                        <th>Data Criação</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-funcoes">
                    <tr>
                        <td colspan="4" class="text-center py-4 text-muted">Carregando funções...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
