<!-- Modal Documentos do Escavador -->
<div class="modal fade" id="modalDocumentosEscavador" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title"><i class="fas fa-file-pdf text-danger"></i> Documentos do Processo <span id="docEscavadorProcessoNum" class="fw-bold"></span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <div class="row g-0 h-100">
                    <!-- Lista de Documentos (Esquerda) -->
                    <div class="col-md-4 border-end bg-light p-3" style="max-height: 70vh; overflow-y: auto;">
                        <h6 class="mb-3 text-uppercase text-muted fw-bold small"><i class="fas fa-list"></i> Lista de Documentos</h6>
                        <div id="listaDocumentosContainer">
                            <div class="text-center py-4 text-muted">
                                <i class="fas fa-spinner fa-spin fa-2x mb-2"></i><br>Buscando documentos...
                            </div>
                        </div>
                    </div>
                    <!-- Visualizador PDF (Direita) -->
                    <div class="col-md-8 p-0 position-relative" style="height: 70vh; background-color: #525659;">
                        <div id="pdfViewerOverlay" class="position-absolute w-100 h-100 d-flex flex-column align-items-center justify-content-center bg-dark text-white" style="opacity: 0.9; z-index: 10;">
                            <i class="fas fa-arrow-left fa-3x mb-3 text-secondary"></i>
                            <h5>Selecione um documento na lista</h5>
                        </div>
                        <iframe id="escavadorPdfFrame" src="" class="w-100 h-100 border-0" style="display:none; z-index: 5; position: relative;"></iframe>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <span class="text-muted small me-auto"><i class="fas fa-info-circle"></i> Os PDFs são baixados diretamente da base estruturada do Escavador.</span>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>
