<div class="container-fluid fade-in px-4 pt-4 pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 mb-1"><i class="fas fa-th text-primary me-2"></i> Matriz de Compatibilidade MBTI</h2>
            <p class="text-muted mb-0">Visão geral do cruzamento entre os 16 perfis psicológicos (Candidato × Gestor)</p>
        </div>
        <div class="d-flex gap-2">
            <select class="form-select w-auto" id="filtroMatrizEixo">
                <option value="geral">Geral (Média)</option>
                <option value="comunicacao">Comunicação (25%)</option>
                <option value="lideranca">Liderança (30%)</option>
                <option value="operacional">Operacional (25%)</option>
                <option value="relacional">Relacional (20%)</option>
            </select>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive" style="max-height: 70vh;">
                <table class="table table-bordered table-sm mb-0 text-center align-middle" style="font-size: 0.85rem;" id="tabela-matriz-mbti">
                    <thead class="table-light sticky-top" style="z-index: 2;">
                        <tr>
                            <th class="bg-light align-bottom text-end p-2" style="min-width: 120px; z-index: 3; position: sticky; left: 0;">
                                <span class="text-muted small d-block">Gestores →</span>
                                <strong>Candidatos ↓</strong>
                            </th>
                            <!-- As colunas serão injetadas via JS -->
                        </tr>
                    </thead>
                    <tbody>
                        <!-- As linhas serão injetadas via JS -->
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white py-3">
            <div class="d-flex justify-content-center gap-4 text-muted small">
                <div class="d-flex align-items-center"><span class="badge bg-success me-1">&nbsp;&nbsp;</span> 90-100 Excelente</div>
                <div class="d-flex align-items-center"><span class="badge bg-primary me-1">&nbsp;&nbsp;</span> 70-89 Alta/Boa</div>
                <div class="d-flex align-items-center"><span class="badge bg-warning me-1">&nbsp;&nbsp;</span> 60-69 Moderada</div>
                <div class="d-flex align-items-center"><span class="badge bg-danger me-1">&nbsp;&nbsp;</span> < 60 Crítica</div>
            </div>
        </div>
    </div>
</div>

<script>
    if (typeof MBTICompatibilityEngine === 'undefined') {
        console.error("MBTICompatibilityEngine não está carregado. Por favor, adicione o script no index.html.");
    } else {
        const perfis = MBTICompatibilityEngine.perfis;
        const tabela = document.getElementById('tabela-matriz-mbti');
        const theadTr = tabela.querySelector('thead tr');
        const tbody = tabela.querySelector('tbody');
        const filtro = document.getElementById('filtroMatrizEixo');

        // Cria o cabeçalho
        perfis.forEach(p => {
            const th = document.createElement('th');
            th.className = 'bg-light py-2';
            th.textContent = p;
            th.style.minWidth = '50px';
            theadTr.appendChild(th);
        });

        function renderizarMatriz(eixo) {
            tbody.innerHTML = '';
            perfis.forEach(cand => {
                const tr = document.createElement('tr');
                
                // Coluna fixa da esquerda
                const thCand = document.createElement('th');
                thCand.className = 'bg-light text-end pe-3 py-2';
                thCand.style.position = 'sticky';
                thCand.style.left = '0';
                thCand.style.zIndex = '1';
                thCand.textContent = cand;
                tr.appendChild(thCand);

                perfis.forEach(gest => {
                    const result = MBTICompatibilityEngine.calcular(cand, gest);
                    const td = document.createElement('td');
                    let val = result[eixo];
                    td.textContent = val;
                    
                    // Definir cor de fundo (Heatmap)
                    if (val >= 90) td.style.backgroundColor = 'rgba(25, 135, 84, 0.2)'; // success
                    else if (val >= 80) td.style.backgroundColor = 'rgba(13, 110, 253, 0.2)'; // primary
                    else if (val >= 70) td.style.backgroundColor = 'rgba(13, 110, 253, 0.1)'; // primary light
                    else if (val >= 60) td.style.backgroundColor = 'rgba(255, 193, 7, 0.2)'; // warning
                    else td.style.backgroundColor = 'rgba(220, 53, 69, 0.2)'; // danger

                    td.title = `Candidato ${cand} × Gestor ${gest}\nComunicação: ${result.comunicacao}\nLiderança: ${result.lideranca}\nOperacional: ${result.operacional}\nRelacional: ${result.relacional}`;
                    td.style.cursor = 'help';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        renderizarMatriz('geral');

        filtro.addEventListener('change', (e) => {
            renderizarMatriz(e.target.value);
        });
    }
</script>
