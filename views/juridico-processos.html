<h2 class="page-title">Processos Trabalhistas e Cíveis</h2>

<div class="card shadow-sm border-0 mb-4 bg-white" style="border-radius: 12px;">
    <div class="card-body p-3">
        <div class="row g-3 align-items-end justify-content-between">
            <div class="col-md-9 d-flex flex-wrap gap-2">
                <div class="col-auto">
                    <label class="form-label mb-1 text-muted small fw-bold">Status</label>
                    <select class="form-select form-select-sm border-0 bg-light" id="jur-filtro-status" style="border-radius: 8px;">
                        <option value="">Todos os Status</option>
                        <option value="Ativo">Ativo</option>
                        <option value="Arquivado">Arquivado</option>
                        <option value="Suspenso">Suspenso</option>
                        <option value="Finalizado">Finalizado</option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="form-label mb-1 text-muted small fw-bold">Risco de Perda</label>
                    <select class="form-select form-select-sm border-0 bg-light" id="jur-filtro-risco" style="border-radius: 8px;">
                        <option value="">Todos os Riscos</option>
                        <option value="Baixo">Baixo (Remoto)</option>
                        <option value="Médio">Médio (Possível)</option>
                        <option value="Alto">Alto (Provável)</option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="form-label mb-1 text-muted small fw-bold">Tipo de Ação</label>
                    <select class="form-select form-select-sm border-0 bg-light" id="jur-filtro-tipo" style="border-radius: 8px;">
                        <option value="">Todos os Tipos</option>
                        <option value="Trabalhista">Trabalhista</option>
                        <option value="Cível">Cível</option>
                        <option value="Tributário">Tributário</option>
                        <option value="Consumidor">Consumidor</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
                <div class="col-auto d-flex align-items-end">
                    <button class="btn btn-primary btn-sm" id="btn-filtrar-processos" style="border-radius: 8px; padding: 0.25rem 1rem;">
                        <i class="fas fa-filter"></i> Filtrar
                    </button>
                </div>
            </div>
            <div class="col-md-3 text-md-end mt-3 mt-md-0">
                <button class="btn btn-dark" onclick="abrirModalProcesso()" style="border-radius: 8px; padding: 0.5rem 1.25rem;">
                    <i class="fas fa-plus-circle me-1"></i> Novo Processo
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Mini Dashboards de Evolução -->
<div class="row g-4 mb-4" id="jur-dashboards-processos">
    <!-- Gráfico 1: Evolução Mensal -->
    <div class="col-lg-4">
        <div class="card shadow-sm border-0 h-100" style="border-radius: 12px;">
            <div class="card-body">
                <h6 class="text-muted fw-bold mb-3"><i class="fas fa-chart-line text-primary me-2"></i> Evolução de Entradas</h6>
                <div style="height: 200px; position: relative;">
                    <canvas id="chart-jur-evolucao"></canvas>
                </div>
            </div>
        </div>
    </div>
    <!-- Gráfico 2: Eficiência Financeira (Acordos) -->
    <div class="col-lg-5">
        <div class="card shadow-sm border-0 h-100" style="border-radius: 12px;">
            <div class="card-body">
                <h6 class="text-muted fw-bold mb-3"><i class="fas fa-piggy-bank text-success me-2"></i> Eficiência Financeira em Acordos</h6>
                <div style="height: 200px; position: relative;">
                    <canvas id="chart-jur-financeiro"></canvas>
                </div>
            </div>
        </div>
    </div>
    <!-- Gráfico 3: Status -->
    <div class="col-lg-3">
        <div class="card shadow-sm border-0 h-100" style="border-radius: 12px;">
            <div class="card-body">
                <h6 class="text-muted fw-bold mb-3"><i class="fas fa-chart-pie text-warning me-2"></i> Status da Carteira</h6>
                <div style="height: 200px; position: relative;">
                    <canvas id="chart-jur-status"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card shadow-sm border-0" style="border-radius: 12px; overflow: hidden;">
    <div class="card-header bg-white border-bottom-0 py-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 text-dark fw-bold"><i class="fas fa-balance-scale text-primary me-2"></i> Relação de Processos</h5>
        <div class="input-group input-group-sm" style="max-width: 350px;">
            <span class="input-group-text bg-light border-0 text-muted" style="border-radius: 8px 0 0 8px;"><i class="fas fa-search"></i></span>
            <input type="text" class="form-control bg-light border-0" id="jur-busca-processo" placeholder="Buscar por número, reclamante..." style="border-radius: 0 8px 8px 0;">
        </div>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" style="font-size: 0.9rem;">
                <thead style="background-color: #f8f9fc;">
                    <tr>
                        <th class="border-0 text-muted text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;">Processo / Tipo</th>
                        <th class="border-0 text-muted text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;">Reclamante / Autor</th>
                        <th class="border-0 text-muted text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;">Fase Atual / Advogado</th>
                        <th class="border-0 text-muted text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;">Risco / Valor</th>
                        <th class="border-0 text-muted text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;">Próx. Audiência/Prazo</th>
                        <th class="border-0 text-end text-muted text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-processos-juridico" class="border-top-0">
                    <!-- Conteúdo via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>
