<div class="d-flex justify-content-between align-items-center">
    <h2 class="page-title">Agenda e Prazos</h2>
    <div class="btn-group">
        <button class="btn btn-outline-secondary" onclick="imprimirResumoDoDia()">
            <i class="fas fa-print"></i> Imprimir Resumo do Dia
        </button>
        <button class="btn btn-info" onclick="abrirModalNovaAtividade()">
            <i class="fas fa-clipboard-list"></i> Lançar Atividade
        </button>
    </div>
</div>
<!-- Seletor de Visualização -->
<div class="nav nav-pills my-3">
    <button class="nav-link active" id="btn-view-cards" onclick="alternarVisaoAgenda('cards')"><i
            class="fas fa-th-large me-2"></i>Cards</button>
    <button class="nav-link" id="btn-view-calendario" onclick="alternarVisaoAgenda('calendario')"><i
            class="fas fa-calendar-alt me-2"></i>Calendário</button>
</div>

<!-- Filtros da Agenda -->
<div class="card my-4">
    <div class="card-body d-flex align-items-center gap-3 flex-wrap agenda-filter-container">
        <span class="fw-bold me-2"><i class="fas fa-filter"></i> Filtrar por Período:</span>
        <input type="date" class="form-control form-control-sm" id="agenda-filtro-inicio" style="width: 180px;">
        <label class="form-label mb-0">até</label>
        <input type="date" class="form-control form-control-sm" id="agenda-filtro-fim" style="width: 180px;">
        <select class="form-select form-select-sm" id="agenda-filtro-status" style="width: 180px;">
            <option value="">Todos os Status</option>
            <option value="Aberto">Aberto</option>
            <option value="Em Andamento">Em Andamento</option>
            <option value="Pausado">Pausado</option>
            <option value="Concluído">Concluído</option>
            <option value="Atrasado">Atrasado</option>
        </select>
        <button class="btn btn-primary btn-sm" id="btn-filtrar-agenda">
            <i class="fas fa-search"></i> Aplicar
        </button>
        <button class="btn btn-outline-secondary btn-sm" id="btn-limpar-filtro-agenda" title="Limpar Filtro">
            <i class="fas fa-times"></i>
        </button>
        <div class="form-check form-switch ms-4">
            <input class="form-check-input" type="checkbox" id="agenda-filtro-aniversarios">
            <label class="form-check-label" for="agenda-filtro-aniversarios">Incluir
                Aniversários</label>
        </div>
    </div>
</div>

<!-- Visão de Cards -->
<div id="agenda-cards-view" style="max-height: 75vh; overflow-y: auto; padding-right: 15px; overflow-x: hidden;">
    
    <!-- Abas da Agenda -->
    <ul class="nav nav-tabs mb-4 border-0" id="agendaTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active rounded-pill px-4 fw-bold me-2 mb-2" id="visao-geral-tab" data-bs-toggle="tab" data-bs-target="#visao-geral" type="button" role="tab" style="color: var(--bs-body-color);">Visão Geral</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link rounded-pill px-4 fw-bold me-2 mb-2" id="minhas-tarefas-tab" data-bs-toggle="tab" data-bs-target="#minhas-tarefas" type="button" role="tab" style="color: var(--bs-body-color);">Minhas Tarefas</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link rounded-pill px-4 fw-bold mb-2" id="tarefas-equipe-tab" data-bs-toggle="tab" data-bs-target="#tarefas-equipe" type="button" role="tab" style="color: var(--bs-body-color);">Delegadas (Equipe)</button>
        </li>
    </ul>

    <div class="tab-content" id="agendaTabsContent">
        <!-- Aba: Visão Geral (Jarvis) -->
        <div class="tab-pane fade show active" id="visao-geral" role="tabpanel">
            <div id="jarvis-agenda-container">
                <div class="jarvis-panel">
                    <div class="jarvis-avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="jarvis-content">
                        <div class="jarvis-greeting" id="jarvis-agenda-greeting">Analisando sua produtividade...</div>
                        <div class="jarvis-message" id="jarvis-agenda-message">
                            Coletando dados da agenda...
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row mt-4">
                <div class="col-md-6 mb-3">
                    <div class="card bg-danger text-white border-0 shadow-sm h-100 p-4 rounded-4" style="background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h2 class="display-4 fw-bold mb-0 text-white" id="resumo-atrasadas">0</h2>
                                <p class="mb-0 fs-5 text-white opacity-75">Tarefas Atrasadas</p>
                            </div>
                            <i class="fas fa-exclamation-triangle fa-3x opacity-50"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card bg-warning text-dark border-0 shadow-sm h-100 p-4 rounded-4" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h2 class="display-4 fw-bold mb-0 text-white" id="resumo-hoje">0</h2>
                                <p class="mb-0 fs-5 text-white opacity-75">Tarefas para Hoje</p>
                            </div>
                            <i class="fas fa-calendar-day fa-3x text-white opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Aba: Minhas Tarefas -->
        <div class="tab-pane fade" id="minhas-tarefas" role="tabpanel">
            <div class="agenda-container" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
                <!-- Coluna Em Atraso -->
                <div class="agenda-column">
                    <div class="agenda-header">
                        <h3><i class="fas fa-exclamation-triangle"></i> Em Atraso</h3>
                        <span class="badge bg-danger" id="agenda-minhas-count-atraso">0</span>
                    </div>
                    <div class="agenda-cards" id="agenda-minhas-atraso"></div>
                </div>
                
                <!-- Coluna Hoje -->
                <div class="agenda-column border-primary" style="border: 2px solid var(--bs-primary);">
                    <div class="agenda-header">
                        <h3 class="text-primary"><i class="fas fa-calendar-day"></i> Hoje</h3>
                        <span class="badge bg-warning" id="agenda-minhas-count-hoje">0</span>
                    </div>
                    <div class="agenda-cards" id="agenda-minhas-hoje"></div>
                </div>
                
                <!-- Coluna Próximos -->
                <div class="agenda-column">
                    <div class="agenda-header">
                        <h3><i class="fas fa-calendar-week"></i> Próximos (e Futuros)</h3>
                        <span class="badge bg-info" id="agenda-minhas-count-proximos">0</span>
                    </div>
                    <div class="agenda-cards" id="agenda-minhas-proximos"></div>
                </div>
            </div>
        </div>

        <!-- Aba: Tarefas da Equipe -->
        <div class="tab-pane fade" id="tarefas-equipe" role="tabpanel">
            <div class="agenda-container" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
                <!-- Coluna Em Atraso -->
                <div class="agenda-column">
                    <div class="agenda-header">
                        <h3><i class="fas fa-exclamation-triangle"></i> Em Atraso</h3>
                        <span class="badge bg-danger" id="agenda-equipe-count-atraso">0</span>
                    </div>
                    <div class="agenda-cards" id="agenda-equipe-atraso"></div>
                </div>
                
                <!-- Coluna Hoje -->
                <div class="agenda-column border-primary" style="border: 2px solid var(--bs-primary);">
                    <div class="agenda-header">
                        <h3 class="text-primary"><i class="fas fa-calendar-day"></i> Hoje</h3>
                        <span class="badge bg-warning" id="agenda-equipe-count-hoje">0</span>
                    </div>
                    <div class="agenda-cards" id="agenda-equipe-hoje"></div>
                </div>
                
                <!-- Coluna Próximos -->
                <div class="agenda-column">
                    <div class="agenda-header">
                        <h3><i class="fas fa-calendar-week"></i> Próximos (e Futuros)</h3>
                        <span class="badge bg-info" id="agenda-equipe-count-proximos">0</span>
                    </div>
                    <div class="agenda-cards" id="agenda-equipe-proximos"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Visão de Calendário -->
<div id="agenda-calendario-view" class="d-none">
    <!-- O calendário será renderizado aqui pelo JavaScript -->
</div>
