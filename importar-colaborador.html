<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar Colaborador (Lorena Leal)</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- Configuração do Firebase -->
    <script src="js/env-loader.js"></script>
    <script src="firebase-config.js"></script>
    <script src="js/constantes-setores.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .btn { padding: 10px 20px; font-size: 16px; background-color: #0d6efd; color: white; border: none; cursor: pointer; border-radius: 5px; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #log { margin-top: 20px; background: #f4f4f4; padding: 15px; border-radius: 5px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; }
    </style>
</head>
<body>
    <h2>Importação de Colaborador e Histórico (Teorema)</h2>
    <p>Selecione o arquivo JSON exportado do Teorema para importar o histórico de um colaborador específico.</p>
    
    <div id="loginSection" style="display: none; background: #fff3cd; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
        <h4>Autenticação Necessária</h4>
        <p>Por favor, faça login com sua conta do Nexter para autorizar a importação:</p>
        <input type="email" id="email" placeholder="E-mail" style="padding: 8px; margin-right: 10px;">
        <input type="password" id="senha" placeholder="Senha" style="padding: 8px; margin-right: 10px;">
        <button onclick="fazerLogin()" class="btn" style="background-color: #198754;">Login</button>
    </div>

    <div style="margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; background-color: #f8f9fa; display: flex; gap: 20px;">
        <div style="flex: 1;">
            <label for="funcSelect" style="font-weight: bold; display: block; margin-bottom: 10px;">Por Colaborador (CPF):</label>
            <select id="funcSelect" style="margin-bottom: 15px; padding: 10px; width: 100%; font-size: 16px;">
                <option value="">Carregando colaboradores...</option>
            </select>
            <button id="btnImportar" class="btn" onclick="iniciarImportacao()" disabled style="background-color: #6f42c1; width: 100%;">✨ Importar Individual</button>
        </div>
        <div style="flex: 1; border-left: 1px solid #ccc; padding-left: 20px;">
            <label for="setorSelect" style="font-weight: bold; display: block; margin-bottom: 10px;">Ou Importação em Lote (Por Setor):</label>
            <select id="setorSelect" style="margin-bottom: 15px; padding: 10px; width: 100%; font-size: 16px;">
                <option value="">Carregando setores...</option>
            </select>
            <button id="btnImportarLote" class="btn" onclick="iniciarImportacaoLote()" disabled style="background-color: #198754; width: 100%;">🚀 Importar Setor Inteiro</button>
        </div>
    </div>
    
    <div id="log">Aguardando...</div>

    <script>
        // Inicialização Global do Firebase
        if (!firebase.apps.length && window.__FIREBASE_CONFIG__) {
            firebase.initializeApp(window.__FIREBASE_CONFIG__);
        }
        const db = firebase.firestore();

        // Controla o estado de autenticação
        let currentUser = null;
        firebase.auth().onAuthStateChanged((user) => {
            currentUser = user;
            const btn = document.getElementById('btnImportar');
            const loginSec = document.getElementById('loginSection');
            
            if (user) {
                loginSec.style.display = 'none';
                btn.disabled = false;
                document.getElementById('btnImportarLote').disabled = false;
                log(`🔐 Sessão detectada! Logado como: ${user.email}`);
                carregarFuncionarios();
            } else {
                loginSec.style.display = 'block';
                btn.disabled = true;
                document.getElementById('btnImportarLote').disabled = true;
                log(`⚠️ Atenção: Nenhuma sessão ativa encontrada. Faça login acima.`);
            }
        });

        window.todosFuncionariosCache = [];
        async function carregarFuncionarios() {
            try {
                log('Carregando setores...');
                const setorSelect = document.getElementById('setorSelect');
                setorSelect.innerHTML = '<option value="">-- Selecione o Setor --</option>';
                
                let setoresArray = [];
                if (typeof SETORES_OFICIAIS !== 'undefined') {
                    setoresArray = [...SETORES_OFICIAIS];
                }
                setoresArray.sort();
                
                setoresArray.forEach(nomeSetor => {
                    setorSelect.innerHTML += `<option value="${nomeSetor}">${nomeSetor}</option>`;
                });

                log('Carregando lista de funcionários ativos...');
                const snap = await db.collection('funcionarios').where('status', 'in', ['Ativo', 'ATIVO']).orderBy('nome').get();
                const select = document.getElementById('funcSelect');
                select.innerHTML = '<option value="">-- Selecione o Colaborador --</option>';
                snap.forEach(doc => {
                    const f = doc.data();
                    window.todosFuncionariosCache.push(f);
                    if(f.cpf) {
                        select.innerHTML += `<option value="${f.cpf}">${f.nome} (CPF: ${f.cpf})</option>`;
                    }
                });
                log(`✅ ${snap.size} funcionários carregados.`);
            } catch(e) {
                log(`❌ Erro ao carregar funcionários: ${e.message}`);
            }
        }

        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            if(!email || !senha) return alert("Preencha e-mail e senha!");
            
            try {
                log("Autenticando...");
                await firebase.auth().signInWithEmailAndPassword(email, senha);
                log("✅ Login realizado com sucesso!");
            } catch (error) {
                log("❌ Erro no login: " + error.message);
            }
        }

        function log(message) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += message + '\n';
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        async function iniciarImportacaoLote() {
            const setor = document.getElementById('setorSelect').value;
            if (!setor) return alert("Por favor, selecione um setor na lista.");
            if (!currentUser) return alert("Faça login primeiro");
            
            const btnLote = document.getElementById('btnImportarLote');
            const btnIndiv = document.getElementById('btnImportar');
            
            btnLote.disabled = true; 
            btnIndiv.disabled = true;
            
            log(`🚀 INICIANDO IMPORTAÇÃO EM LOTE PARA O SETOR: ${setor}`);
            const funcsDoSetor = window.todosFuncionariosCache.filter(f => f.setor === setor && f.cpf);
            
            if(funcsDoSetor.length === 0) {
                log(`Nenhum funcionário ativo com CPF encontrado para o setor ${setor}.`);
                btnLote.disabled = false; btnIndiv.disabled = false;
                return;
            }
            
            log(`Encontrados ${funcsDoSetor.length} funcionários com CPF neste setor.`);
            for (let i = 0; i < funcsDoSetor.length; i++) {
                log(`\n--- Processando (${i+1}/${funcsDoSetor.length}): ${funcsDoSetor[i].nome} ---`);
                await processarImportacaoCpf(funcsDoSetor[i].cpf);
            }
            log(`\n✅ LOTE FINALIZADO COM SUCESSO PARA O SETOR: ${setor}!`);
            
            btnLote.disabled = false; 
            btnIndiv.disabled = false;
        }

        async function iniciarImportacao() {
            const cpf = document.getElementById('funcSelect').value;
            if (!cpf) {
                alert("Por favor, selecione um colaborador na lista.");
                return;
            }
            const btnLote = document.getElementById('btnImportarLote');
            const btnIndiv = document.getElementById('btnImportar');
            btnLote.disabled = true; btnIndiv.disabled = true;
            
            await processarImportacaoCpf(cpf);
            
            btnLote.disabled = false; btnIndiv.disabled = false;
        }

        async function processarImportacaoCpf(cpfSelecionado) {
            if (!currentUser) {
                log('❌ ERRO: Você não está logado no Firebase.');
                return;
            }

            log(`✨ Solicitando extração mágica do Teorema para o CPF: ${cpfSelecionado}...`);

            try {
                // Fazer fetch no servidor local
                const response = await fetch(`http://localhost:3000/extrair-teorema/${cpfSelecionado}`);
                const jsonResp = await response.json();
                
                if(!response.ok || !jsonResp.success) {
                    throw new Error(jsonResp.error || 'Erro desconhecido na extração do Teorema.');
                }
                
                const dados = jsonResp.dados;
                
                log(`✅ Dados extraídos com sucesso! Processando Colaborador: ${dados.funcionario.nome}`);
                
                const admOriginal = dados.funcionario.dataAdmissao ? new Date(dados.funcionario.dataAdmissao).toLocaleDateString('pt-BR', {timeZone: 'UTC'}) : 'N/A';
                const dem = dados.funcionario.dataDemissao ? new Date(dados.funcionario.dataDemissao).toLocaleDateString('pt-BR', {timeZone: 'UTC'}) : 'Contrato Ativo';
                log(`🗓️ <b>Entrada:</b> ${admOriginal} &nbsp;|&nbsp; <b>Saída:</b> ${dem}`);
                
                const cpfBuscado = String(dados.funcionario.cpf).replace(/\D/g, ''); // limpa o CPF para busca segura

                // 1. Procurar Funcionário Existente (Ativo) no Nexter
                log('Buscando funcionário no banco do Nexter...');
                const querySnap = await db.collection('funcionarios')
                    .where('status', 'in', ['Ativo', 'ATIVO'])
                    .get();

                let funcionarioId = null;
                querySnap.forEach(doc => {
                    const f = doc.data();
                    if (f.cpf && f.cpf.replace(/\D/g, '') === cpfBuscado) {
                        funcionarioId = doc.id;
                    }
                });

                if (!funcionarioId) {
                    log('❌ ERRO: O funcionário não foi encontrado na base do Nexter (ou não está Ativo). O histórico não foi importado.');
                    return;
                }

                log(`✅ Funcionário localizado (UID: ${funcionarioId}). Atualizando flag de importação...`);
                await db.collection('funcionarios').doc(funcionarioId).update({
                    importadoTeorema: true
                });

                // 2. Limpar dados anteriores dessa origem (para caso de dupla importação)
                log('Limpando histórico antigo (se houver)...');
                
                // Limpar Folha
                const prevFolha = await db.collection('lancamentos_financeiros').where('funcionarioId', '==', funcionarioId).where('origem', '==', 'Teorema').get();
                if (!prevFolha.empty) {
                    let batchDel = db.batch();
                    prevFolha.forEach(doc => batchDel.delete(doc.ref));
                    await batchDel.commit();
                }

                // Limpar Férias
                const prevFerias = await db.collection('funcionarios').doc(funcionarioId).collection('historico_ferias').where('origem', '==', 'Teorema').get();
                if (!prevFerias.empty) {
                    let batchDel = db.batch();
                    prevFerias.forEach(doc => batchDel.delete(doc.ref));
                    await batchDel.commit();
                }

                // Limpar Salários
                const prevSalarios = await db.collection('funcionarios').doc(funcionarioId).collection('historico_salarial').where('origem', '==', 'Teorema').get();
                if (!prevSalarios.empty) {
                    let batchDel = db.batch();
                    prevSalarios.forEach(doc => batchDel.delete(doc.ref));
                    await batchDel.commit();
                }

                // 3. Inserir Férias e Evolução Salarial no próprio documento do funcionário (Subcoleções)
                log('Salvando histórico de férias e evolução salarial...');
                const batchFuncionario = db.batch();
                
                dados.ferias.forEach(f => {
                    const docRef = db.collection('funcionarios').doc(funcionarioId).collection('historico_ferias').doc();
                    batchFuncionario.set(docRef, f);
                });
                
                dados.salarios.forEach(s => {
                    const docRef = db.collection('funcionarios').doc(funcionarioId).collection('historico_salarial').doc();
                    batchFuncionario.set(docRef, s);
                });
                await batchFuncionario.commit();
                log('✅ Férias e Salários salvos.');

                // 4. Inserir Movimentações na coleção lancamentos_financeiros
                log(`Iniciando envio de ${dados.movimentacoes.length} movimentações da folha em lotes...`);
                let batchMovs = db.batch();
                let contagem = 0;

                for (let i = 0; i < dados.movimentacoes.length; i++) {
                    const m = dados.movimentacoes[i];
                    const docRef = db.collection('lancamentos_financeiros').doc();
                    
                    batchMovs.set(docRef, {
                        ...m,
                        funcionarioId: funcionarioId,
                        funcionarioNome: dados.funcionario.nome,
                        importado_em: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    contagem++;

                    if (contagem % 450 === 0) {
                        log(`Enviando lote de 450 movimentações...`);
                        await batchMovs.commit();
                        batchMovs = db.batch();
                    }
                }

                if (contagem % 450 !== 0) {
                    await batchMovs.commit();
                }

                log('✅ SUCESSO! O histórico foi totalmente anexado ao colaborador existente.');
            } catch (error) {
                log('❌ ERRO DURANTE A IMPORTAÇÃO: ' + error.message);
                console.error(error);
            }
        }
    </script>
</body>
</html>
