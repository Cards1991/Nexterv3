<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoatendimento - Candidato | Nexter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/refined.css">
    <style>
        body {
            background-color: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .totem-container {
            max-width: 800px;
            width: 100%;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 80vh;
        }
        .totem-header {
            background: var(--gradient-primary, #0d6efd);
            color: #fff;
            padding: 30px;
            text-align: center;
        }
        .totem-header h2 {
            margin: 0;
            font-weight: 700;
        }
        .totem-body {
            padding: 40px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .step-container {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .step-container.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .mbti-option-card {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mbti-option-card:hover {
            border-color: #b3d4fc;
            background-color: #f8fbff;
        }
        .mbti-option-card.selected {
            border-color: #0d6efd;
            background-color: #e6f0ff;
        }
    </style>
</head>
<body>

    <div class="totem-container">
        <div class="totem-header">
            <h2><i class="fas fa-clipboard-user me-2"></i> Portal do Candidato</h2>
            <p class="mb-0 mt-2 opacity-75">Por favor, preencha seus dados e responda ao perfil comportamental.</p>
        </div>
        
        <div class="totem-body">
            <!-- Passo 1: Dados Básicos -->
            <div id="step-dados" class="step-container active">
                <h4 class="mb-4 text-center text-primary">Seus Dados</h4>
                <form id="form-candidato-totem">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nome Completo</label>
                        <input type="text" class="form-control form-control-lg" id="totem-nome" required placeholder="Digite seu nome completo">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">CPF</label>
                            <input type="text" class="form-control form-control-lg" id="totem-cpf" required placeholder="000.000.000-00" oninput="formatarCpfTotem(this)">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Telefone (WhatsApp)</label>
                            <input type="text" class="form-control form-control-lg" id="totem-telefone" required placeholder="(00) 00000-0000">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Vaga Pretendida</label>
                        <select class="form-select form-select-lg" id="totem-vaga" required>
                            <option value="">Selecione uma vaga...</option>
                            <!-- Carregado via JS -->
                        </select>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="button" class="btn btn-primary btn-lg text-white fw-bold" onclick="avancarParaMbti()" id="btn-avancar-mbti">
                            Iniciar Teste de Perfil <i class="fas fa-arrow-right ms-2"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Passo 2: MBTI -->
            <div id="step-mbti" class="step-container">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="text-primary m-0" id="totem-mbti-title">Etapa 1</h4>
                    <span class="badge bg-secondary" id="totem-mbti-progress-text">1 de 4</span>
                </div>
                <div class="progress mb-4" style="height: 10px;">
                    <div class="progress-bar bg-success" id="totem-mbti-progress" style="width: 25%;"></div>
                </div>
                <p class="text-muted mb-4" id="totem-mbti-desc"></p>

                <div id="totem-mbti-options" class="mb-4">
                    <!-- Opções geradas dinamicamente -->
                </div>

                <div class="d-flex justify-content-between mt-auto">
                    <button class="btn btn-outline-secondary" id="totem-btn-prev" onclick="totemPrevMbtiStep()" style="display: none;">Voltar</button>
                    <button class="btn btn-primary px-4 ms-auto text-white fw-bold" id="totem-btn-next" onclick="totemNextMbtiStep()">Próxima Etapa</button>
                </div>
            </div>

            <!-- Passo 3: Conclusão -->
            <div id="step-conclusao" class="step-container text-center">
                <div class="my-5">
                    <i class="fas fa-check-circle text-success" style="font-size: 80px;"></i>
                </div>
                <h3 class="text-primary fw-bold mb-3">Tudo Certo!</h3>
                <p class="fs-5 text-muted mb-5" id="totem-conclusao-msg">Seus dados e teste de perfil foram registrados com sucesso. O recrutador já tem acesso às suas informações.</p>
                <button class="btn btn-primary btn-lg px-5 text-white fw-bold" onclick="reiniciarTotem()">
                    Finalizar
                </button>
            </div>
            
        </div>
    </div>

    <!-- Firebase SDK (V8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- Configuração do Firebase -->
    <script src="js/env-loader.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        if (!firebase.apps.length && window.__FIREBASE_CONFIG__) {
            firebase.initializeApp(window.__FIREBASE_CONFIG__);
        }
        window.db = firebase.firestore();
    </script>

    <!-- Scripts da Lógica -->
    <script src="js/mbti.js"></script>
    <script src="js/totem-candidato.js"></script>

</body>
</html>
